<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="trashBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f4"/>
      <stop offset="0.55" stop-color="#d3d6dd"/>
      <stop offset="1" stop-color="#a9acb6"/>
    </linearGradient>
    <linearGradient id="trashRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#c4c7cf"/>
    </linearGradient>
    <linearGradient id="trashInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f929c"/>
      <stop offset="1" stop-color="#c0c3cb"/>
    </linearGradient>
  </defs>

  <!-- Crumpled paper poking out of the top, macOS-style. Drawn first so the
       basket rim overlaps its lower edge. -->
  <g stroke="#c9cac4" stroke-width="0.9" stroke-linejoin="round">
    <path d="M18 17 L20.5 8 L26.5 11 L25 18 Z" fill="#f4f4ef"/>
    <path d="M24 15 L27 4.5 L34 8.5 L31.5 16.5 Z" fill="#ffffff"/>
    <path d="M30.5 15.5 L34.5 6 L41.5 10.5 L39 18 Z" fill="#f0f0ea"/>
    <path d="M38 17 L42 8 L47 13.5 L45 19 Z" fill="#f6f6f1"/>
    <path d="M26 17.5 L29 11 L35 15 L33 20 Z" fill="#e9e9e3"/>
  </g>
  <!-- A couple of fold lines to sell the crumple. -->
  <g stroke="#d4d4ce" stroke-width="0.7" opacity="0.9" fill="none">
    <path d="M27 6 L28.5 12"/>
    <path d="M35 7.5 L35 13"/>
    <path d="M42 9.5 L41.5 15"/>
  </g>

  <!-- Basket body: slightly tapered, rounded base, like the macOS wire bin. -->
  <path d="M16.5 16.5 L19.6 50.5 Q20 56 32 56 Q44 56 44.4 50.5 L47.5 16.5 Z"
        fill="url(#trashBody)" stroke="#878a95" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Translucent front ribs so the body reads as a wire/mesh basket. -->
  <g stroke="#9a9da8" stroke-width="1" opacity="0.5" stroke-linecap="round">
    <line x1="24" y1="19.5" x2="22.7" y2="52"/>
    <line x1="32" y1="19.5" x2="32" y2="54"/>
    <line x1="40" y1="19.5" x2="41.3" y2="52"/>
  </g>

  <!-- Soft vertical highlight on the left edge for a glassy look. -->
  <path d="M22.2 20 Q21.4 33 21.7 51" stroke="#ffffff" stroke-width="2.2"
        opacity="0.55" fill="none" stroke-linecap="round"/>

  <!-- Rim: outer ring plus the dark opening, drawn over the paper. -->
  <ellipse cx="32" cy="16.5" rx="15.5" ry="4.4"
           fill="url(#trashRim)" stroke="#878a95" stroke-width="1.2"/>
  <ellipse cx="32" cy="16.5" rx="12.2" ry="3.1" fill="url(#trashInner)" opacity="0.9"/>
</svg>
